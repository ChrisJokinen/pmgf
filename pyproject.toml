[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pmgf"
version = "0.1.0"
description = "Experimental persistent moral governance research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic==2.12.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2", "mypy==1.18.2"]

[project.scripts]
pmgf = "pmgf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

